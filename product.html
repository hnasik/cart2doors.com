<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}
.card {
  max-width: 400px;
  margin: auto;
  background: #fff;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
.card img {
  width: 100%;
  border-radius: 10px;
}
.title {
  font-size: 22px;
  font-weight: bold;
  margin: 10px 0;
}
.price {
  color: green;
  font-size: 20px;
}
.desc {
  margin: 10px 0;
  color: #555;
}
.stock {
  font-size: 14px;
  color: #888;
}
</style>
</head>

<body>

<div class="card" id="productCard">
  Loading product...
</div>

<!-- External JS -->
<script type="module" src="product.js"></script>
</body>
</html>
